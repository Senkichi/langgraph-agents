[build-system]
requires = ["hatchling>=1.6.0,<2.0"]
build-backend = "hatchling.build"

[project]
name = "langgraph-agents"
version = "0.1.0"
description = "LangGraph agent orchestration workflows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic-telemetry",
    "claude-agent-sdk>=0.1.62",
    "langchain-anthropic>=1.4.0",
    "langgraph>=1.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Cross-family judge for experiment 003 Phase 0.1 (judge bias sanity check).
    # Pinned to 1.x because the v2 surface — when it ships — may break the
    # OpenAI() / chat.completions.create() call shape used in run_eval_judge_sanity.py.
    "openai>=1.50,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/langgraph_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
anthropic-telemetry = { path = "../", editable = true }
